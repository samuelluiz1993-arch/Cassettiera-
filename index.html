<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>CNC Drawer Organizer</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f9;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e3350,#0b1220 65%)}main{max-width:570px;margin:auto;padding:28px 18px 45px}header{margin-bottom:26px}.eyebrow{color:#7dd3fc;font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}h1{font-size:29px;letter-spacing:-.04em;margin:9px 0 5px}p{color:#9daec5;margin:0;line-height:1.5}.cabinet{padding:15px;background:linear-gradient(130deg,#64748b,#344155 35%,#1e293b);border:2px solid #8390a3;border-radius:15px;box-shadow:0 22px 50px #0008,inset 0 2px 4px #ffffff2a}.row{display:grid;gap:8px;margin-bottom:9px}.row:last-child{margin:0}.row.top{grid-template-columns:repeat(3,minmax(0,1fr))}.drawer{position:relative;appearance:none;border:1px solid #8592a5;border-bottom:5px solid #111b2c;border-radius:7px;background:linear-gradient(160deg,#46566c,#28364a);color:#f1f5f9;min-height:119px;padding:12px 7px 19px;cursor:pointer;box-shadow:inset 0 2px 0 #ffffff22,0 3px 5px #0005;display:flex;align-items:center;flex-direction:column;justify-content:space-between;gap:10px;text-align:center;transition:transform .15s,background .15s}.drawer:active{transform:translateY(2px)}.drawer:focus-visible,.back:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}.drawer .tag{font-size:10px;color:#b9c7d9;letter-spacing:.1em;font-weight:800}.drawer .label{font-size:12px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}.row:not(.top) .drawer{min-height:102px}.row:not(.top) .label{font-size:15px}.handle{width:48%;height:7px;border-radius:10px;background:linear-gradient(#a9b7c8,#56657a);border:1px solid #a5b3c4;box-shadow:0 2px 3px #0008}.row:not(.top) .handle{width:22%}.foot{margin:17px 4px;color:#90a4bb;font-size:13px;text-align:center}.panel{display:none;background:#172438;border:1px solid #40516a;border-radius:16px;padding:22px;min-height:300px}.panel h2{font-size:24px;margin:22px 0 12px}.empty{border:1px dashed #536780;border-radius:12px;padding:34px 12px;text-align:center;margin-top:24px;color:#aebdd0}.empty strong{display:block;color:#e8f1fc;font-size:17px;margin-bottom:8px}.back{border:1px solid #526782;background:#273952;color:white;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}.form{display:grid;gap:10px;margin:22px 0 18px}.form label{font-size:13px;color:#bdcde1;font-weight:700}.form input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #60748c;background:#0e1b2c;color:#fff;font:inherit}.primary{background:#0ea5e9;color:#061323;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.item-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}.item{background:#223249;border:1px solid #415672;border-radius:11px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.item strong{display:block;overflow-wrap:anywhere}.item .desc{font-size:13px;color:#b4c4d7;margin-top:4px;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-shrink:0}.action{background:#344b66;color:#fff;border:1px solid #60748c;border-radius:7px;padding:8px;cursor:pointer;font-size:12px}.action.danger{color:#fecaca}.empty[hidden]{display:none}.small{font-size:13px;color:#8fa5bf;margin-top:16px}body.open .cabinet,body.open .foot{display:none}body.open .panel{display:block}body.open header{display:none}@media(min-width:500px){.row.top .label{font-size:14px}}

.form select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #60748c;background:#0e1b2c;color:#fff;font:inherit}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.extra{display:grid;gap:10px}.item-info{min-width:0;flex:1}.item .meta{font-size:13px;color:#7dd3fc;margin-top:5px;line-height:1.45}.item{align-items:flex-start}.actions{flex-direction:column}.form [hidden],.extra[hidden]{display:none!important}@media(max-width:360px){.field-grid{grid-template-columns:1fr}}
</style></head><body><main><header><div class="eyebrow">Magazzino utensili · v0.3</div><h1>CNC Drawer Organizer</h1><p>Seleziona un cassetto per visualizzarne il contenuto.</p></header><section class="cabinet" aria-label="Cassettiera con sei cassetti"><div class="row top"><button class="drawer" data-id="1A" data-name="Viteria varia"><span class="tag">CASSETTO 1A</span><span class="label">VITERIA</span><span class="handle"></span></button><button class="drawer" data-id="1B" data-name="Inserti filettatura trapezoidale SX"><span class="tag">CASSETTO 1B</span><span class="label">TRAP. SX</span><span class="handle"></span></button><button class="drawer" data-id="1C" data-name="Inserti filettatura trapezoidale DX"><span class="tag">CASSETTO 1C</span><span class="label">TRAP. DX</span><span class="handle"></span></button></div><div class="row"><button class="drawer" data-id="2" data-name="Inserti per sgrossatura e finitura"><span class="tag">CASSETTO 2</span><span class="label">INSERTI TORNITURA</span><span class="handle"></span></button></div><div class="row"><button class="drawer" data-id="3" data-name="Punte e frese"><span class="tag">CASSETTO 3</span><span class="label">PUNTE E FRESE</span><span class="handle"></span></button></div><div class="row"><button class="drawer" data-id="4" data-name="Maschi"><span class="tag">CASSETTO 4</span><span class="label">MASCHI</span><span class="handle"></span></button></div></section><p class="foot">4 livelli · 6 cassetti</p><section class="panel" aria-live="polite"><button class="back" id="back">← Torna alla cassettiera</button><h2 id="panelTitle"></h2><p id="panelSubtitle"></p><form class="form" id="toolForm"><div class="extra" id="cuttingFields" hidden><label>Tipo utensile *<select id="cutType"><option value="Punta">Punta</option><option value="Fresa">Fresa</option></select></label><div class="field-grid"><label>Diametro (mm) *<input id="cutDiameter" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Es. 12"></label><label>Lunghezza lavorabile (mm) *<input id="cutLength" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Es. 35"></label></div><label>Materiale utensile *<select id="cutMaterial"><option value="HSS">HSS</option><option value="HSS-Co">HSS-Co</option><option value="Metallo duro">Metallo duro (MD)</option><option value="Altro">Altro</option></select></label><label id="coolantRow">Refrigerante interno *<select id="cutCoolant"><option value="No">No</option><option value="Sì">Sì</option></select></label></div><div class="extra" id="tapFields" hidden><label>Tipo filettatura *<select id="tapThread"><option value="Metrico">Metrico</option><option value="GAS">GAS (G/BSPP)</option></select></label><label>Tecnologia *<select id="tapMethod"><option value="A taglio">A taglio</option><option value="A rullare">A rullare</option></select></label><div class="field-grid"><label>Misura *<input id="tapSize" maxlength="40" placeholder="Es. M12 o G1/4"></label><label id="tapPitchRow">Passo (mm) *<input id="tapPitch" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Es. 1.75"></label></div></div><label id="codeRow">Codice o nome utensile *<input id="toolCode" maxlength="100" required placeholder="Es. CNMG 120408" autocomplete="off"></label><label>Descrizione (facoltativa)<input id="toolDesc" maxlength="220" placeholder="Es. Inserto per sgrossatura"></label><button class="primary" id="saveTool" type="submit">+ Aggiungi utensile</button><button class="action" id="cancelEdit" type="button" hidden>Annulla modifica</button></form><ul class="item-list" id="itemList"></ul><div class="empty" id="empty"><strong>Nessun utensile registrato</strong>Aggiungi il primo utensile usando i campi qui sopra.</div><p class="small">CNC Drawer Organizer · Versione 0.3</p></section></main><script>
// Conserva la chiave v0.2 per mantenere tutti gli utensili già registrati.
const STORAGE_KEY='cnc-drawer-organizer-v02';
const $=id=>document.getElementById(id);
const buttons=[...document.querySelectorAll('.drawer')];
const form=$('toolForm'),code=$('toolCode'),desc=$('toolDesc'),list=$('itemList'),empty=$('empty'),cancel=$('cancelEdit'),save=$('saveTool');
const cutting=$('cuttingFields'),tapping=$('tapFields'),cutType=$('cutType'),cutDiameter=$('cutDiameter'),cutLength=$('cutLength'),cutMaterial=$('cutMaterial'),cutCoolant=$('cutCoolant'),tapThread=$('tapThread'),tapMethod=$('tapMethod'),tapSize=$('tapSize'),tapPitch=$('tapPitch');
let current=null,editing=null,records={},storageOK=true;
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const stored=JSON.parse(raw);if(stored&&typeof stored==='object'&&!Array.isArray(stored))records=stored;else throw Error('Formato non valido');}}catch(e){storageOK=false;alert('Dati salvati non leggibili: modifica disabilitata per evitare perdite.');}
function persist(){if(!storageOK)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records));return true;}catch(e){alert('Salvataggio non riuscito: controlla le impostazioni del browser.');return false;}}
function positive(input,label){const n=Number(input.value);if(!input.value.trim()||!Number.isFinite(n)||n<=0){alert('Inserisci '+label+' maggiore di zero.');input.focus();return null;}return n;}
function configure(){const isCut=current==='3',isTap=current==='4';cutting.hidden=!isCut;tapping.hidden=!isTap;$('codeRow').hidden=isCut||isTap;code.required=!(isCut||isTap);cutDiameter.required=isCut;cutLength.required=isCut;tapSize.required=isTap;tapPitch.required=isTap&&tapThread.value==='Metrico';$('tapPitchRow').hidden=tapThread.value!=='Metrico';$('coolantRow').hidden=cutType.value!=='Punta';cutCoolant.disabled=cutType.value!=='Punta';}
cutType.addEventListener('change',configure);tapThread.addEventListener('change',configure);
function resetForm(){form.reset();editing=null;save.textContent='+ Aggiungi utensile';cancel.hidden=true;configure();}
function meta(item){if(item.kind==='cut'){let bits=[item.type||'Utensile'];if(item.diameter)bits.push('Ø'+item.diameter+' mm');if(item.length)bits.push('L utile '+item.length+' mm');if(item.material)bits.push(item.material);if(item.type==='Punta'&&item.coolant)bits.push('Refrigerante interno: '+item.coolant);return bits.join(' · ');}if(item.kind==='tap')return [item.thread,item.method].filter(Boolean).join(' · ');return '';}
function render(){list.replaceChildren();const items=Array.isArray(records[current])?records[current]:[];empty.hidden=items.length>0;items.forEach((item,index)=>{const li=document.createElement('li');li.className='item';const info=document.createElement('div');info.className='item-info';const strong=document.createElement('strong');strong.textContent=item.code||'Utensile';info.append(strong);const m=meta(item);if(m){const el=document.createElement('div');el.className='meta';el.textContent=m;info.append(el);}if(item.desc){const p=document.createElement('div');p.className='desc';p.textContent=item.desc;info.append(p);}const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='action';edit.type='button';edit.textContent='Modifica';edit.addEventListener('click',()=>{editing=index;resetFieldsFromItem(item);save.textContent='Salva modifica';cancel.hidden=false;window.scrollTo({top:0,behavior:'smooth'});});const del=document.createElement('button');del.className='action danger';del.type='button';del.textContent='Elimina';del.addEventListener('click',()=>{if(!confirm('Eliminare "'+item.code+'" dal cassetto?'))return;const prev=records[current].slice();records[current].splice(index,1);if(!persist())records[current]=prev;resetForm();render();});actions.append(edit,del);li.append(info,actions);list.append(li);});}
function resetFieldsFromItem(item){form.reset();code.value=item.code||'';desc.value=item.desc||'';if(current==='3'){cutType.value=item.type||'Punta';cutDiameter.value=item.diameter??'';cutLength.value=item.length??'';cutMaterial.value=item.material||'HSS';cutCoolant.value=item.coolant||'No';}if(current==='4'){tapThread.value=item.thread||'Metrico';tapMethod.value=item.method||'A taglio';tapSize.value=item.size||item.code||'';tapPitch.value=item.pitch??'';}configure();}
function show(id){const button=buttons.find(x=>x.dataset.id===id);if(!button){current=null;document.body.classList.remove('open');return;}current=id;$('panelTitle').textContent=button.dataset.name;$('panelSubtitle').textContent='Cassetto '+id;resetForm();render();document.body.classList.add('open');}
form.addEventListener('submit',e=>{e.preventDefault();if(!current||!storageOK)return;let item={code:code.value.trim(),desc:desc.value.trim()};if(current==='3'){const diameter=positive(cutDiameter,'un diametro');if(diameter===null)return;const length=positive(cutLength,'una lunghezza lavorabile');if(length===null)return;item={...item,kind:'cut',type:cutType.value,diameter,length,material:cutMaterial.value,coolant:cutType.value==='Punta'?cutCoolant.value:null,code:cutType.value+' Ø'+diameter};}else if(current==='4'){const size=tapSize.value.trim();if(!size){alert('Inserisci la misura del maschio.');tapSize.focus();return;}let pitch=null;if(tapThread.value==='Metrico'){pitch=positive(tapPitch,'un passo');if(pitch===null)return;}item={...item,kind:'tap',thread:tapThread.value,method:tapMethod.value,size,pitch,code:size+(pitch!==null?' × '+pitch:'')};}else if(!item.code)return;
const previous=Array.isArray(records[current])?records[current].slice():[];if(!Array.isArray(records[current]))records[current]=[];if(editing!==null&&records[current][editing])records[current][editing]=item;else records[current].push(item);if(!persist()){records[current]=previous;return;}resetForm();render();});
cancel.addEventListener('click',resetForm);buttons.forEach(b=>b.addEventListener('click',()=>location.hash='cassetto-'+encodeURIComponent(b.dataset.id)));$('back').addEventListener('click',()=>location.hash='');window.addEventListener('hashchange',()=>show(decodeURIComponent(location.hash.replace('#cassetto-',''))));show(decodeURIComponent(location.hash.replace('#cassetto-','')));
</script></body></html>
