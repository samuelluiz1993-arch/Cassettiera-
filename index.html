<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>CNC Drawer Organizer</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f9;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e3350,#0b1220 65%)}main{max-width:570px;margin:auto;padding:28px 18px 45px}header{margin-bottom:26px}.eyebrow{color:#7dd3fc;font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}h1{font-size:29px;letter-spacing:-.04em;margin:9px 0 5px}p{color:#9daec5;margin:0;line-height:1.5}.cabinet{padding:15px;background:linear-gradient(130deg,#64748b,#344155 35%,#1e293b);border:2px solid #8390a3;border-radius:15px;box-shadow:0 22px 50px #0008,inset 0 2px 4px #ffffff2a}.row{display:grid;gap:8px;margin-bottom:9px}.row:last-child{margin:0}.row.top{grid-template-columns:repeat(3,minmax(0,1fr))}.drawer{position:relative;appearance:none;border:1px solid #8592a5;border-bottom:5px solid #111b2c;border-radius:7px;background:linear-gradient(160deg,#46566c,#28364a);color:#f1f5f9;min-height:119px;padding:12px 7px 19px;cursor:pointer;box-shadow:inset 0 2px 0 #ffffff22,0 3px 5px #0005;display:flex;align-items:center;flex-direction:column;justify-content:space-between;gap:10px;text-align:center;transition:transform .15s,background .15s}.drawer:active{transform:translateY(2px)}.drawer:focus-visible,.back:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}.drawer .tag{font-size:10px;color:#b9c7d9;letter-spacing:.1em;font-weight:800}.drawer .label{font-size:12px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}.row:not(.top) .drawer{min-height:102px}.row:not(.top) .label{font-size:15px}.handle{width:48%;height:7px;border-radius:10px;background:linear-gradient(#a9b7c8,#56657a);border:1px solid #a5b3c4;box-shadow:0 2px 3px #0008}.row:not(.top) .handle{width:22%}.foot{margin:17px 4px;color:#90a4bb;font-size:13px;text-align:center}.panel{display:none;background:#172438;border:1px solid #40516a;border-radius:16px;padding:22px;min-height:300px}.panel h2{font-size:24px;margin:22px 0 12px}.empty{border:1px dashed #536780;border-radius:12px;padding:34px 12px;text-align:center;margin-top:24px;color:#aebdd0}.empty strong{display:block;color:#e8f1fc;font-size:17px;margin-bottom:8px}.back{border:1px solid #526782;background:#273952;color:white;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}.small{font-size:13px;color:#8fa5bf;margin-top:16px}body.open .cabinet,body.open .foot{display:none}body.open .panel{display:block}body.open header{display:none}@media(min-width:500px){.row.top .label{font-size:14px}}
</style></head><body><main><header><div class="eyebrow">Magazzino utensili · v0.1</div><h1>CNC Drawer Organizer</h1><p>Seleziona un cassetto per visualizzarne il contenuto.</p></header><section class="cabinet" aria-label="Cassettiera con sei cassetti"><div class="row top"><button class="drawer" data-id="1A" data-name="Viteria varia"><span class="tag">CASSETTO 1A</span><span class="label">VITERIA</span><span class="handle"></span></button><button class="drawer" data-id="1B" data-name="Inserti filettatura trapezoidale SX"><span class="tag">CASSETTO 1B</span><span class="label">TRAP. SX</span><span class="handle"></span></button><button class="drawer" data-id="1C" data-name="Inserti filettatura trapezoidale DX"><span class="tag">CASSETTO 1C</span><span class="label">TRAP. DX</span><span class="handle"></span></button></div><div class="row"><button class="drawer" data-id="2" data-name="Inserti per sgrossatura e finitura"><span class="tag">CASSETTO 2</span><span class="label">INSERTI TORNITURA</span><span class="handle"></span></button></div><div class="row"><button class="drawer" data-id="3" data-name="Punte e frese"><span class="tag">CASSETTO 3</span><span class="label">PUNTE E FRESE</span><span class="handle"></span></button></div><div class="row"><button class="drawer" data-id="4" data-name="Maschi"><span class="tag">CASSETTO 4</span><span class="label">MASCHI</span><span class="handle"></span></button></div></section><p class="foot">4 livelli · 6 cassetti</p><section class="panel" aria-live="polite"><button class="back" id="back">← Torna alla cassettiera</button><h2 id="panelTitle"></h2><p id="panelSubtitle"></p><div class="empty"><strong>Nessun utensile registrato</strong>La gestione degli utensili sarà aggiunta nel prossimo aggiornamento.</div><p class="small">CNC Drawer Organizer · Versione 0.1</p></section></main><script>
const buttons=document.querySelectorAll('.drawer');const title=document.getElementById('panelTitle');const subtitle=document.getElementById('panelSubtitle');function show(id){const button=[...buttons].find(x=>x.dataset.id===id);if(!button){document.body.classList.remove('open');return}title.textContent=button.dataset.name;subtitle.textContent='Cassetto '+id;document.body.classList.add('open');}buttons.forEach(b=>b.addEventListener('click',()=>{location.hash='cassetto-'+encodeURIComponent(b.dataset.id)}));document.getElementById('back').addEventListener('click',()=>{location.hash='';});window.addEventListener('hashchange',()=>show(decodeURIComponent(location.hash.replace('#cassetto-',''))));show(decodeURIComponent(location.hash.replace('#cassetto-','')));
</script></body></html>
